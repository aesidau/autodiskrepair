tapo:
  ip: "192.168.0.197"
  email: "andrew@aes.id.au"
  password: "secret"

drives:
  broken_model: "ST1000DM"
  recovery_mount: "/mnt/backup"
  image: "/mnt/backup/lynnedisk.img"
  mapfile: "/mnt/backup/mapfile.log"

timeouts:
  power_off_settle: 20
  device_appear: 120

failure:
  dmesg_patterns:
    - "I/O error"
    - "SCSI error"
    - "Device offlined"
    - "reset \\S+ USB device"
    - "[Tt]imed out|timeout"
    - "failed command"
  no_progress_limit: 5
  stall_timeout: 120

logging:
  file: "/var/log/autodiskrepair.log"
  max_bytes: 10485760
  backup_count: 5
